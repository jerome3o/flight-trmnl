services:
  window-flights:
    build: .
    ports:
      - "8000:8000"
    # Real location/secrets live in a local .env (gitignored). See .env.example.
    env_file:
      - path: .env
        required: false
    environment:
      # active defaults (safe to leave as-is; everything below is optional)
      REFRESH_RATE: "30"     # seconds the device sleeps between polls
      RENDER_INTERVAL: "30"  # seconds between board renders (keep the two
                             # matched: polling faster than you render just
                             # wakes the radio for an unchanged image)

      # --- the view cone (set your own location; see .env.example) ---
      # LAT: "51.5074"
      # LON: "-0.1278"
      # BEARING: "135"
      # FOV: "145"
      # RANGE_KM: "5"
      # MIN_ELEV: "8"
      # SOURCE: "adsblol"      # adsblol | airplaneslive | adsbfi
      # BOARD_REFRESH_S: "10"  # background rescan cadence (see .env.example)
      # ADSB_TIMEOUT_S: "10"
      # ROUTE_TIMEOUT_S: "4"
      # FR24_ENABLED: "1"      # off by default; needed as well as F24_KEY
      # --- route lookup: free, no key, no quota (see .env.example) ---
      # ROUTE_PROVIDERS: "adsbdb,hexdb"   # origin/destination + flight number
      # ROUTE_STRICT: "1"      # require both DBs to agree on a route, else blank
      # ROUTE_MAX_NEW: "8"     # new callsigns looked up per render
      # ROUTE_BUDGET_S: "8"    # wall-clock budget for those lookups

      # --- arrival prediction (see .env.example for the reasoning) ---
      # PREDICT_RANGE_KM: "30"     # scan radius for approaching traffic
      # PREDICT_HORIZON_MIN: "4"   # how far ahead to project
      # PREDICT_CONFIRM_S: "90"    # seconds a prediction must persist (0 = off)
      # PREDICT_MISS_MAX_KM: "0"   # 0 = off; drop predictions missing by more
      # MAX_BOARD_FLIGHTS: "14"    # rows on the board
      # --- the watch ring: near + filed for a local field (see .env.example) ---
      # WATCH_KM: "10"             # radius; 0 disables it
      # WATCH_AIRPORTS: "LHR,LCY"  # destinations that earn a NEAR row
      # WATCH_MAX: "4"             # most watch rows at once
      # MAP_RANGE_KM: "15"         # radius the map draws
      # TURN_ENABLED: "1"          # off by default; enables turn/arc features
      # TURN_MIN_DPS: "0.4"        # deg/s below which an aircraft is level
      # APPROACH_MAX_KM: "45"      # range within which to claim an approach
      # APPROACH_MAX_FT: "12000"   # ...and the altitude ceiling for it

      # --- BYOS display (point the TRMNL at http://<host-ip>:8000) ---
      # Match your panel; firmware rejects a wrong-sized image (see .env.example)
      # RENDER_WIDTH: "1872"    # TRMNL X: 1872x1404 4bit | OG: 800x480 2bit
      # RENDER_HEIGHT: "1404"
      # RENDER_DEPTH: "4bit"    # 4bit (TRMNL X) | 2bit | 1bit (legacy)
      # DEVICE_SALT: "long-random-secret"  # REQUIRED for a public deployment

      # --- optional TRMNL-cloud webhook path (not needed for BYOS) ---
      # TRMNL_PLUGIN_UUID: "plugin-setting-uuid"
      # TRMNL_PLUS: "1"
      # PUSH_INTERVAL: "300"
    restart: unless-stopped
