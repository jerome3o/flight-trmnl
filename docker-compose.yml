services:
  window-flights:
    build: .
    ports:
      - "8000:8000"
    # Real location/secrets live in a local .env (gitignored). See .env.example.
    env_file:
      - path: .env
        required: false
    environment:
      # active defaults (safe to leave as-is; everything below is optional)
      REFRESH_RATE: "60"     # seconds the device sleeps between polls
      RENDER_INTERVAL: "55"  # seconds between board renders

      # --- the view cone (set your own location; see .env.example) ---
      # LAT: "51.5074"
      # LON: "-0.1278"
      # BEARING: "120"
      # FOV: "145"
      # RANGE_KM: "5"
      # MIN_ELEV: "8"
      # SOURCE: "adsblol"      # adsblol | airplaneslive | adsbfi
      # ROUTE_PROVIDERS: "adsbdb,hexdb"   # origin/destination lookup chain
      # ROUTE_STRICT: "1"      # require both DBs to agree on a route, else blank

      # --- arrival prediction (see .env.example for the reasoning) ---
      # PREDICT_RANGE_KM: "30"     # scan radius for approaching traffic
      # PREDICT_HORIZON_MIN: "4"   # how far ahead to project
      # PREDICT_CONFIRM: "2"       # renders a prediction must survive (1 = off)
      # PREDICT_MISS_MAX_KM: "0"   # 0 = off; drop predictions missing by more
      # MAX_BOARD_FLIGHTS: "14"    # rows on the board

      # --- BYOS display (point the TRMNL at http://<host-ip>:8000) ---
      # Match your panel; firmware rejects a wrong-sized image (see .env.example)
      # RENDER_WIDTH: "1872"    # TRMNL X: 1872x1404 4bit | OG: 800x480 2bit
      # RENDER_HEIGHT: "1404"
      # RENDER_DEPTH: "4bit"    # 4bit (TRMNL X) | 2bit | 1bit (legacy)
      # DEVICE_SALT: "long-random-secret"  # REQUIRED for a public deployment

      # --- optional TRMNL-cloud webhook path (not needed for BYOS) ---
      # TRMNL_PLUGIN_UUID: "plugin-setting-uuid"
      # TRMNL_PLUS: "1"
      # PUSH_INTERVAL: "300"
    restart: unless-stopped
