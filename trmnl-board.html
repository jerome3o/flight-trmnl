<meta charset="UTF-8">
<title>Overhead — map + split-flap board</title>
<!--
  "Window watch" screen for TRMNL BYOS rendering: a full-width header, the
  map and board side by side beneath it, and a diagnostics line along the
  bottom.

  · LEFT  (64%): a view-up radar-style vector map centred on home — view
    cone, range rings, Thames, landmarks, compass rose, home marker, and each
    aircraft plotted at its (bearing, distance) with a heading arrow and its
    flight number.
  · RIGHT (36%): one split-flap list — FLIGHT · FROM · TO · ETA, with the
    airline and origin as a text line above each row's tiles.

  · Resolution-independent: the layout fills the viewport, so the same file
    renders correctly at 800×480 (TRMNL OG) or 1872×1404 (TRMNL X). Point
    headless Chrome at it with a window matching the panel:
      chromium --headless --window-size=1872,1404 --screenshot=shot.png board.html
    then quantize (see render_loop.py). Tile size, visible rows and the map
    geometry are all computed from the viewport by layout()/buildMap() below.
  · Data: tries GET /api/board (same-origin, i.e. when served by serve.py);
    falls back to embedded SAMPLE data so the file previews standalone.
  · Font: Oswald via Google Fonts for previewing. In the docker image, bundle
    the font file and swap the <link> for a local @font-face — headless
    Chrome without network will otherwise fall back to Arial Narrow.
  · Palette: pure greyscale only — the panel is quantized to 4-bit grey, so
    any hue is wasted. Light / paper theme (white page, black ink).
-->

    --tile-fs:15px; --seam-h:1px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100vw;height:100vh;overflow:hidden}
  /* Full-width header on top, map + board side by side beneath, diagnostics
     as a full-width strip along the bottom — so the map keeps its whole
     height instead of giving a slice back to the console. */
  body{
    background:var(--k);
    font-family:'Oswald','Arial Narrow',Arial,sans-serif;
    color:var(--w);
    display:flex;flex-direction:column;
  }
  .main{flex:1 1 auto;min-height:0;display:flex;flex-direction:row}

  /* ---- LEFT: the map panel, now the dominant half of the screen ---- */
  .left{
    width:64%;height:100%;
    padding:var(--pad-y) calc(var(--pad-x)*.6) var(--pad-y) var(--pad-x);
    display:flex;flex-direction:column;
  }
  #svg{flex:1;width:100%;min-height:0;display:block}

  /* ---- diagnostics: one line across the full width of the panel ---- */
  .debug{
    flex:0 0 auto;
    border-top:calc(var(--seam-h)*3) solid var(--w);
    padding:calc(var(--pad-y)*.55) var(--pad-x) calc(var(--pad-y)*.75);
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:var(--dbg-fs,13px);
    line-height:1.45;
    letter-spacing:.01em;
    color:var(--l);
    display:flex;align-items:baseline;justify-content:space-between;gap:1.4em;
    white-space:pre;overflow:hidden;
  }
  .debug .seg{display:flex;gap:1.5em}
  /* label so the strip reads as the diagnostics console, not a stray line */
  .debug .tag{
    font-weight:700;color:var(--w);letter-spacing:.18em;flex:0 0 auto;
  }
  .debug b{color:var(--w);font-weight:600}
  .debug .bar{color:var(--w)}
  .debug .emg{color:var(--w);font-weight:700}

  /* ---- RIGHT: the split-flap panel ---- */
  .right{
    width:36%;height:100%;
    padding:var(--pad-y) var(--pad-x) var(--pad-y) calc(var(--pad-x)*.7);
    display:flex;flex-direction:column;
    border-left:calc(var(--seam-h)*2) solid var(--l);
  }

  /* ---- header, spanning the whole panel ---- */
  header{
    flex:0 0 auto;
    display:flex;justify-content:space-between;align-items:baseline;
    border-bottom:calc(var(--seam-h)*2) solid var(--w);
    padding:calc(var(--pad-y)*.6) var(--pad-x) calc(var(--pad-y)*.55);
  }
  .brand{font-size:var(--brand-fs);font-weight:600;letter-spacing:.12em;color:var(--w)}
  .brand small{color:var(--l);font-weight:500;letter-spacing:.18em;font-size:calc(var(--brand-fs)*.55);margin-left:.5em}
  .clock{font-size:var(--brand-fs);font-weight:600;letter-spacing:.08em;color:var(--w)}
  .hdr-right{display:flex;align-items:center;gap:.7em}
  .batt{display:flex;align-items:center;gap:.32em;font-size:calc(var(--brand-fs)*.62);font-weight:600;color:var(--l);letter-spacing:.04em}
  .batt-ic{width:2em;height:.92em;display:block}
  .batt-v{font-size:.82em;font-weight:500}

  /* ---- column labels ---- */
  .cols{display:flex;gap:var(--col-gap);margin-bottom:calc(var(--pad-y)*.5)}
  .cols span{
    font-size:var(--label-fs);font-weight:500;letter-spacing:.18em;color:var(--l);
    text-transform:uppercase;
  }

  /* ---- the board ---- */
  #board{flex:1;display:flex;flex-direction:column;justify-content:space-between}
  /* Each row stacks: airline + origin on a text line, split-flap tiles below.
     The airline is no longer a column of its own — at 36% width the tiles
     need the full row. */
  .row{display:flex;flex-direction:column;gap:calc(var(--tile-h)*.10)}
  .flaps{display:flex;gap:var(--col-gap)}
  .grp{display:flex;gap:var(--tile-gap)}
  .tile{
    width:var(--tile-w);height:var(--tile-h);
    background:var(--k);
    border:1px solid var(--d);
    border-radius:calc(var(--tile-w)*.15);
    position:relative;
    display:flex;align-items:center;justify-content:center;
    font-size:var(--tile-fs);font-weight:600;line-height:1;color:var(--w);
    text-transform:uppercase;
  }
  /* the split-flap seam */
  .tile::after{
    content:"";position:absolute;left:0;right:0;top:50%;
    height:var(--seam-h);background:var(--d);
  }
  .tile.blank{color:var(--d)}          /* empty flap */
  .tile.dim{color:var(--l)}            /* secondary info flaps */

  /* airline + origin: one de-emphasised text line above each row's tiles */
  .meta{
    display:flex;align-items:baseline;gap:.4em;
    font-size:var(--airline-fs);line-height:1.1;
    letter-spacing:.02em;color:var(--l);
    white-space:nowrap;overflow:hidden;
  }
  .meta .nm{font-weight:600;text-transform:uppercase;color:var(--w);flex:0 0 auto}
  /* aircraft type — no longer a column of flaps, but still worth knowing */
  .meta .ty{font-weight:600;color:var(--l);flex:0 0 auto;letter-spacing:.06em}
  /* banking onto an approach — inverted so it reads at a glance */
  .meta .turn{
    flex:0 0 auto;background:var(--w);color:var(--k);
    font-weight:700;letter-spacing:.08em;padding:0 .35em;white-space:nowrap;
  }
  .meta .sub{
    font-weight:400;opacity:.9;
    overflow:hidden;text-overflow:ellipsis;
  }
  .row.blank .meta{visibility:hidden}

  /* ---- vertical-trend glyph (climb/descent) on the airline sub-line ---- */
  .trend{
    display:inline-block;font-weight:600;color:var(--l);
    margin-right:.28em;font-size:.95em;line-height:1;
  }
  .trend.lvl{color:var(--d)}       /* level = dim dash */
  .trend.up,.trend.dn{color:var(--w)}

  /* ---- emergency squawk: bold, unmistakable, greyscale only ---- */
  .row.emerg{outline:calc(var(--seam-h)*2) solid var(--w);outline-offset:2px}
  .row.emerg .tile{border-color:var(--w);font-weight:700;color:var(--w)}
  .emerg-badge{
    display:inline-block;background:var(--w);color:var(--k);
    font-weight:700;letter-spacing:.06em;padding:0 .4em;
    white-space:nowrap;text-transform:uppercase;
  }
  #emerg-banner{
    display:none;background:var(--w);color:var(--k);
    font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    text-align:center;padding:calc(var(--pad-y)*.4) 0;
    margin-bottom:calc(var(--pad-y)*.5);
    font-size:calc(var(--brand-fs)*.6);
  }

  /* ---- header meta: view cone + in-view count, alongside battery ---- */
  .hdr-meta{
    font-size:calc(var(--brand-fs)*.5);letter-spacing:.14em;
    color:var(--l);text-transform:uppercase;white-space:nowrap;
  }
</style>
</head>
<body>
  <header>
    <div class="brand">OVERHEAD</div>
    <div class="hdr-right">
      <div class="batt" id="batt"></div>
      <div class="hdr-meta" id="hdr-meta">135° SE · 5 KM</div>
      <div class="clock" id="clock">16:42</div>
    </div>
  </header>
  <div class="main">
    <div class="left">
      <svg id="svg" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <div class="right">
      <div id="emerg-banner"></div>
      <div class="cols" id="cols"></div>
      <div id="board"></div>
    </div>
  </div>
  <div class="debug" id="debug"></div>

<script>
/* Column layout for the split-flap list. Each: [label, width-in-tiles, dim?]
   The airline now rides above each row as plain text rather than occupying a
   column, and the aircraft type is gone — the flight number identifies the
   flight better and needs the width the type column used to hold. Both ends
   of the route stay: with one mixed list, FROM and TO are the only way to
   tell an inbound from an outbound. */
/* [label, width-in-tiles, dim?, right-aligned?] — ETA is right-aligned so the
   spare flap for a second digit sits on the LEFT, keeping the M in ~10M and
   ~3M in the same column instead of ragged. */
const COLS=[["FLIGHT",6,false,false],
            ["FROM",  3,false,false],
            ["TO",    3,false,false],
            ["ETA",   4,false,true ]];
let ROWS=5;   /* recomputed from the viewport by layout() */

/* Size the split-flap board to fit the RIGHT panel (32% of the viewport):
   derive tile size from that width so all columns fit, then fill the panel
   height with as many split-flap rows as it takes. */
function layout(){
  const set=document.documentElement.style;
  const W=window.innerWidth, H=window.innerHeight;
  const rightW = W*0.36;                                 // right panel width
  const nCols   = COLS.reduce((a,c)=>a+c[1],0);          // tiles across
  const nGroups = COLS.length;                            // column groups
  const nTileGap= COLS.reduce((a,c)=>a+c[1]-1,0);        // gaps within groups
  const padX = Math.round(rightW*0.03);
  // width budget: tileW*nCols + (0.1*tileW)*nTileGap + (0.55*tileW)*(nGroups-1).
  // The panel's own padding is padX right + 0.7*padX left; reserve that plus a
  // few px for the left border and sub-pixel rounding across 16 tiles, or the
  // last ETA flap gets clipped by the panel edge.
  const denom = nCols + 0.1*nTileGap + 0.55*(nGroups-1);
  const tileW = (rightW - padX*1.7 - 8) / denom;
  const tileH = tileW*2.3;
  const padY  = Math.round(H*0.025);
  const labelFs = Math.max(8, Math.round(tileW*0.62));
  set.setProperty("--pad-x", padX+"px");
  set.setProperty("--pad-y", padY+"px");
  set.setProperty("--tile-w", tileW.toFixed(2)+"px");
  set.setProperty("--tile-h", tileH.toFixed(2)+"px");
  set.setProperty("--tile-gap", (tileW*0.1).toFixed(2)+"px");
  set.setProperty("--col-gap", (tileW*0.55).toFixed(2)+"px");
  set.setProperty("--brand-fs", Math.round(tileH*0.5)+"px");
  set.setProperty("--label-fs", labelFs+"px");
  set.setProperty("--tile-fs", Math.round(tileH*0.58)+"px");
  const metaFs = Math.max(10, Math.round(tileH*0.30));
  set.setProperty("--airline-fs", metaFs+"px");
  set.setProperty("--seam-h", Math.max(1, Math.round(tileH*0.022))+"px");
  // diagnostics: a single line spanning the full panel width
  const dbgFs = Math.max(9, Math.min(24, Math.round(W*0.0115)));
  set.setProperty("--dbg-fs", dbgFs+"px");
  // Rows are meta line + tiles stacked, so the stride is taller than a tile.
  // Budget the header and the diagnostics line out of the panel height first.
  const brandFs  = Math.round(tileH*0.5);
  const headerH  = padY*1.15 + brandFs*1.45;
  const debugH   = padY*1.1 + dbgFs*1.45;
  const chrome   = padY*2 + labelFs*2.4;      // right-panel padding + col labels
  const rowStride = tileH + metaFs*1.15 + tileH*0.10 + tileH*0.16;
  ROWS = Math.max(1, Math.min(24,
    Math.floor((H - headerH - debugH - chrome) / rowStride)));
}

/* Fallback sample — same shape as /api/board (config + geo + flights[]) so
   the file previews standalone. e = km EAST of home, n = km NORTH (neg = south);
   the Thames + landmarks sit south of the flat, matching the real backend. */
const SAMPLE={
  config:{bearing:135.0, fov:145.0, range_km:5.0, predict_range_km:30.0,
    map_range_km:20.0, horizon_min:4.0,
    battery:{voltage:3.98, percent:77, rssi:-61},
    debug:{source:"ADSB+DB+FR24", n_scan:318, n_board:8, n_held:2, n_enriched:8, n_fr24:1, n_turn:3, turn:true,
      fetched_at:Date.now()/1000-4, error:null, fr24:true,
      credits_used:120, credits_est:48, credits_cap:29000},
    geo:{
      thames:[[-4.56,-3.58],[-3.98,-2.70],[-3.30,-2.05],[-2.60,-1.75],
        [-1.95,-1.30],[-1.30,-1.45],[-0.80,-1.30],[-0.30,-1.55],[0.30,-1.95],
        [1.10,-2.20],[2.10,-1.85],[2.80,-1.32],[3.60,-1.55],[4.65,-1.58],
        [5.50,-1.95],[6.40,-1.60]],
      landmarks:[
        {name:"SHARD",     e:-1.55, n:-1.42},
        {name:"ST PAUL'S", e:-2.38, n:-0.38},
        {name:"CANARY WHF",e: 2.81, n:-1.32},
        {name:"THE O2",    e: 4.65, n:-1.58},
        {name:"GREENWICH", e: 4.40, n:-4.49}
      ]
    }
  },
  flights:[
    {callsign:"BAW23", flight_no:"BA23", airline:"BRITISH AIRWAYS", type:"A21N",
     in_view:true, eta_min:0, bearing_deg:150.0, dist_km:3.1, track_deg:270,
     alt_ft:5900, vs_fpm:-820, squawk:"7700", eta:"2026-07-24T16:47:00Z",
     origin:{iata:"CDG",city:"Paris",country:"FR"}, destination:{iata:"LHR",country:"GB"}},
    {callsign:"CFE21B", flight_no:"BA8721", airline:"BA CITYFLYER", type:"E190",
     in_view:true, eta_min:0, bearing_deg:118.0, dist_km:4.2, track_deg:305,
     alt_ft:5200, vs_fpm:1450, squawk:"6142", eta:"2026-07-24T16:49:00Z",
     origin:{iata:"DUB",city:"Dublin",country:"IE"}, destination:{iata:"LCY",country:"GB"}},
    {callsign:"KLM43W", flight_no:"KL1043", airline:"KLM", type:"B738",
     in_view:false, eta_min:3.0, bearing_deg:150, dist_km:9.5, track_deg:322,
     turn_dps:-2.1, turning_for:"LHR", gs_kt:210,
     alt_ft:9000, vs_fpm:120, squawk:"2000", eta:"2026-07-24T16:52:00Z",
     origin:{iata:"AMS",city:"Amsterdam",country:"NL"}, destination:{iata:"LHR",country:"GB"}},
    {callsign:"VIR5F", flight_no:"VS5", airline:"VIRGIN ATLANTIC", type:"A35K",
     in_view:false, eta_min:5.0, bearing_deg:132, dist_km:13.0, track_deg:300,
     turn_dps:1.4, gs_kt:240,
     alt_ft:12000, vs_fpm:2200, squawk:null, eta:"2026-07-24T16:54:00Z",
     origin:{iata:"JFK",city:"New York",country:"US"}, destination:{iata:"LHR",country:"GB"}},
    {callsign:"EZY31KG", flight_no:"U28703", airline:"EASYJET", type:"A320",
     in_view:false, eta_min:6.0, bearing_deg:212, dist_km:17.0, track_deg:40,
     alt_ft:14000, origin:{iata:"CDG",city:"Paris",country:"FR"}, destination:null},
    {callsign:"DLH4XA", flight_no:"LH906", airline:"LUFTHANSA", type:"A21N",
     in_view:false, eta_min:8.0, bearing_deg:240, dist_km:21.0, track_deg:70,
     alt_ft:24000, origin:{iata:"FRA",city:"Frankfurt",country:"DE"}, destination:{iata:"LHR",country:"GB"}},
    {callsign:"UAE7T", flight_no:"EK7", airline:"EMIRATES", type:"B77W",
     in_view:false, eta_min:9.0, bearing_deg:110, dist_km:25.0, track_deg:298,
     alt_ft:28000, origin:{iata:"DXB",city:"Dubai",country:"AE"}, destination:{iata:"LHR",country:"GB"}},
    {callsign:"LOT285", flight_no:"LO285", airline:"LOT POLISH", type:"B738",
     in_view:false, eta_min:10.0, bearing_deg:60, dist_km:28.0, track_deg:200,
     alt_ft:31000, origin:{iata:"WAW",city:"Warsaw",country:"PL"}, destination:{iata:"LHR",country:"GB"}},
  ]
};

const CARD=["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
const cardinal=d=>CARD[Math.round(d/22.5)%16];
const iata=p=>p?(p.iata||p.icao||""):"";
const ctry=p=>p&&p.country?String(p.country).slice(0,2):"";

/* full country name from a 2-letter code, via the browser's locale data */
let _regions=null; try{ _regions=new Intl.DisplayNames(["en"],{type:"region"}); }catch(e){}
function countryName(code){
  if(!code) return "";
  code=String(code).toUpperCase().slice(0,2);
  try{ return (_regions && _regions.of(code)) || code; }catch(e){ return code; }
}
/* "City, Country" for the origin, in full (falls back gracefully) */
function originFull(f){
  const o=(f&&f.origin)||{};
  const city=o.city?String(o.city):"";
  const country=countryName(o.country);
  return city && country ? city+", "+country : (city||country||"");
}
/* The flight number (BA172) when FR24 enrichment supplied one, else the raw
   ADS-B callsign (BAW172) — same flight, the identifier you'd hear on the
   radio rather than the one on a boarding pass. */
const flightNo=f=>String((f&&(f.flight_no||f.callsign))||"").toUpperCase();
/* list ETA (split-flap): NOW / ~5M */
const etaText=f=> (f.in_view || !f.eta_min || f.eta_min<=0) ? "NOW" : ("~"+Math.round(f.eta_min)+"M");

/* emergency transponder squawks (octal) → meaning */
const EMERG={"7500":"HIJACK","7600":"RADIO FAIL","7700":"EMERGENCY"};
const emergOf=f=> (f&&f.squawk!=null&&EMERG[String(f.squawk)]) || "";

/* vertical-trend glyph from vs_fpm: climb ▲ / descent ▼ / level – (dash) */
function trendGlyph(f){
  const v=f?f.vs_fpm:null;
  if(v==null) return "";
  if(v>250)  return `<span class="trend up" title="climbing">&#9650;</span>`;
  if(v<-250) return `<span class="trend dn" title="descending">&#9660;</span>`;
  return `<span class="trend lvl" title="level">&#8211;</span>`;
}

/* ---- diagnostics console (lower strip of the map panel) ---- */
function creditBar(p,n){
  const f=Math.max(0,Math.min(n,Math.round(p*n)));
  return "["+"█".repeat(f)+"░".repeat(n-f)+"]";
}
/* One line across the bottom: counters grouped left, health readouts right.
   Full width fits everything that used to need three stacked lines. */
function renderDebug(cfg){
  const el=document.getElementById("debug");
  const d=cfg&&cfg.debug;
  if(!d){ el.textContent="DIAG  —  no debug data"; return; }
  const left=[`SRC <b>${esc(d.source||"?")}</b>`,
              `SCAN <b>${d.n_scan}</b>`,
              `BOARD <b>${d.n_board}</b>`,
              `HELD <b>${d.n_held||0}</b>`,
              `ENR <b>${d.n_enriched}</b>`,
              // "off" vs "0" matters: one means the feature is disabled, the other
              // means the feed carries no bank angle or rate of turn
              `TURN <b>${d.turn===false?"off":(d.n_turn==null?"?":d.n_turn)}</b>`];
  let fr24;
  if(d.fr24===false){
    fr24=`FR24 <b>off</b>`;
  }else{
    const cap=d.credits_cap||0;
    const used=(d.credits_used!=null)?d.credits_used:d.credits_est;
    const pct=cap?used/cap:0;
    // "+2" = how many of this render's flights needed FR24 because the free
    // route databases had no answer for them
    fr24=`FR24 <b>+${d.n_fr24||0}</b> ${used}/${cap} `+
         `<span class="bar">${creditBar(pct,10)}</span> ${(pct*100).toFixed(1)}%`;
  }
  const age=(d.fetched_at!=null)?Math.max(0,Math.round(Date.now()/1000-d.fetched_at)):"?";
  const err=(d.error==null||d.error==="")?"—":esc(String(d.error));
  const right=[fr24, `AGE <b>${age}s</b>`, `ERR <b>${err}</b>`];
  el.innerHTML=`<span class="tag">DIAG</span>`+
               `<span class="seg">${left.map(s=>`<span>${s}</span>`).join("")}</span>`+
               `<span class="seg">${right.map(s=>`<span>${s}</span>`).join("")}</span>`;
}

function fit(text,n,right){
  text=(text||"").toUpperCase().replace(/[^A-Z0-9 °\-~]/g," ");
  if(text.length>n) return text.slice(0,n);
  return right ? text.padStart(n," ") : text.padEnd(n," ");
}

function tiles(text,n,dim,right){
  return [...fit(text,n,right)].map(ch=>
    `<div class="tile ${ch===" "?"blank":dim?"dim":""}">${ch===" "?"·":ch}</div>`
  ).join("");
}

function rowHtml(f){
  const emg=emergOf(f);
  const vals = f ? [
    flightNo(f),                 // FLIGHT  IATA flight number, else callsign
    iata(f.origin),              // FROM    origin IATA
    iata(f.destination),         // TO      destination IATA
    etaText(f),                  // ETA
  ] : COLS.map(()=>"");
  // meta line: climb/descent glyph, airline, origin city — or, on an
  // emergency, a bold inverted badge in place of the origin.
  let meta = "";
  if(f){
    const nm=esc(fit((f.airline||f.type_desc||"").toUpperCase(), 24).trim());
    const ty=f.type?esc(String(f.type).toUpperCase()):"";
    const sub = emg
      ? `<span class="emerg-badge">! ${esc(f.squawk)} ${esc(emg)}</span>`
      : esc(originFull(f));
    // an aircraft banking onto a local approach is the most interesting thing
    // it can be doing, so it displaces the origin city while the turn lasts
    const turning = f.turning_for
      ? `<span class="turn">${f.turn_dps<0?"&#8634;":"&#8635;"} ${esc(f.turning_for)}</span>`
      : "";
    meta = `<div class="meta">${trendGlyph(f)}<span class="nm">${nm}</span>`+
           (ty?`<span class="ty">· ${ty}</span>`:"")+turning+
           (sub&&!turning?`<span class="sub">${emg?"":"· "}${sub}</span>`:"")+`</div>`;
  } else {
    meta = `<div class="meta"><span class="nm">·</span></div>`;
  }
  const flaps = COLS.map(([label,n,dim,right],i)=>
    `<div class="grp">${tiles(vals[i],n,dim,right)}</div>`).join("");
  return `<div class="row${emg?" emerg":""}${f?"":" blank"}">`+
         meta+`<div class="flaps">${flaps}</div></div>`;
}

/* ---------------- LEFT PANEL: the vector map ---------------- */

const D2R=Math.PI/180;
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}

/* Clamp the ray home→(px,py) to an inset rectangle; returns the border point. */
function rayToRect(hx,hy,px,py,minX,minY,maxX,maxY){
  const dx=px-hx, dy=py-hy;
  let t=Infinity;
  if(dx>1e-6)  t=Math.min(t,(maxX-hx)/dx);
  if(dx<-1e-6) t=Math.min(t,(minX-hx)/dx);
  if(dy>1e-6)  t=Math.min(t,(maxY-hy)/dy);
  if(dy<-1e-6) t=Math.min(t,(minY-hy)/dy);
  if(!isFinite(t)) t=0;
  return [hx+dx*t, hy+dy*t];
}

/* ZOOMED forward-facing local map, drawn VIEW-UP: the direction the window
   faces points straight up the screen, so the map matches what you actually
   see out of it — left on the map is left through the glass, and further up
   the panel is further away. Home therefore sits near the BOTTOM with the
   cone opening upward, and the small amount of world behind you is cropped.
   North is no longer up, so the compass rose (top-left) rotates instead. */
function buildMap(cfg, flights){
  const svg=document.getElementById("svg");
  const box=svg.getBoundingClientRect();
  const W=Math.max(50,box.width), H=Math.max(50,box.height);
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const fs=Math.max(9, Math.min(W,H)*0.026);
  const strokeW=Math.max(1, Math.min(W,H)*0.0020);

  const bearing=cfg.bearing||0, fov=cfg.fov||120;
  const range=cfg.range_km||25;
  const mapRange=cfg.map_range_km||20;
  const geo=cfg.geo||{};

  // projection: VIEW-UP. The world is rotated by the viewing bearing so that
  // bearing points up the screen, then home sits near the bottom-centre at a
  // fixed zoom to map_range_km.
  const pxPerKm=(H*0.80)/mapRange;
  const homeX=W/2, homeY=H*0.86;
  const vb=bearing*D2R, cosB=Math.cos(vb), sinB=Math.sin(vb);
  // (e,n) km east/north of home → screen px, rotated so `bearing` is up
  const proj=(e,n)=>[homeX + (e*cosB - n*sinB)*pxPerKm,
                     homeY - (e*sinB + n*cosB)*pxPerKm];
  // polar (compass bearing, dist) → screen px; relative bearing 0 = straight up
  const projBD=(bd,d)=>{const a=(bd-bearing)*D2R;
                        return [homeX + d*Math.sin(a)*pxPerKm,
                                homeY - d*Math.cos(a)*pxPerKm];};
  // compass bearing → unit vector in screen space (heading arrows, compass rose)
  const dirBD=b=>{const a=(b-bearing)*D2R; return [Math.sin(a), -Math.cos(a)];};

  const P=[]; // svg pieces
  const dark="var(--w)", grey="var(--l)", lite="var(--d)", paper="var(--k)";
  const river="#888888";

  // everything drawn inside the panel is clipped to it
  P.push(`<defs>
    <clipPath id="pan"><rect x="0" y="0" width="${W}" height="${H}"/></clipPath>
    <marker id="ah" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="${dark}"/></marker>
    <marker id="ahg" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="${grey}"/></marker>
  </defs>`);
  P.push(`<g clip-path="url(#pan)">`);

  // ---- view cone wedge (what the window sees), radius = range_km scaled ----
  const coneR=range*pxPerKm;
  const a0=bearing-fov/2, a1=bearing+fov/2;
  const [x0,y0]=projBD(a0,range), [x1,y1]=projBD(a1,range);
  const largeArc=fov>180?1:0;
  P.push(`<path d="M${homeX.toFixed(1)},${homeY.toFixed(1)} L${x0.toFixed(1)},${y0.toFixed(1)} `+
         `A${coneR.toFixed(1)},${coneR.toFixed(1)} 0 ${largeArc} 1 ${x1.toFixed(1)},${y1.toFixed(1)} Z" `+
         `fill="${lite}" fill-opacity="0.28" stroke="${grey}" stroke-width="${strokeW}" stroke-opacity="0.6"/>`);
  // dashed centre line along the viewing bearing
  const [bx,by]=projBD(bearing,range);
  P.push(`<line x1="${homeX}" y1="${homeY}" x2="${bx.toFixed(1)}" y2="${by.toFixed(1)}" stroke="${grey}" `+
         `stroke-width="${strokeW}" stroke-dasharray="${(fs*0.4).toFixed(1)} ${(fs*0.4).toFixed(1)}"/>`);

  // ---- faint distance arcs (centred on home) with tiny km labels ----
  for(const km of [5,10,15,20]){
    if(km>mapRange) break;
    const rr=km*pxPerKm;
    P.push(`<circle cx="${homeX}" cy="${homeY}" r="${rr.toFixed(1)}" fill="none" stroke="${lite}" `+
           `stroke-width="${strokeW}" stroke-opacity="0.9"/>`);
    // labels ride up the ring ahead of home, just left of the centre line
    P.push(`<text x="${(homeX-fs*2.4).toFixed(1)}" y="${(homeY-rr+fs*0.85).toFixed(1)}" `+
           `text-anchor="end" font-family="Oswald,sans-serif" font-size="${(fs*0.62).toFixed(1)}" fill="${grey}">${km}km</text>`);
  }

  // ---- River Thames polyline ----
  const th=geo.thames||[];
  if(th.length>1){
    const pts=th.map(p=>{const[x,y]=proj(p[0],p[1]);return `${x.toFixed(1)},${y.toFixed(1)}`;}).join(" ");
    P.push(`<polyline points="${pts}" fill="none" stroke="${river}" stroke-width="${(strokeW*2.6).toFixed(2)}" `+
           `stroke-linejoin="round" stroke-linecap="round"/>`);
    // THAMES label on a clear western segment, away from the landmark cluster
    const mid=th[Math.floor(th.length*0.14)];
    if(mid){const[mx,my]=proj(mid[0],mid[1]);
      if(mx>fs&&mx<W-fs*4&&my>0&&my<H)
        P.push(`<text x="${mx.toFixed(1)}" y="${(my+fs*1.15).toFixed(1)}" font-family="Oswald,sans-serif" `+
               `font-size="${(fs*0.6).toFixed(1)}" letter-spacing="2" fill="${river}">THAMES</text>`);
    }
  }

  // ---- landmarks: hollow marker + tiny label, skip off-panel ----
  const lmR=Math.max(2.2, fs*0.24);
  for(const lm of (geo.landmarks||[])){
    const [x,y]=proj(lm.e,lm.n);
    if(x<fs||x>W-fs||y<0||y>H) continue;
    P.push(`<rect x="${(x-lmR).toFixed(1)}" y="${(y-lmR).toFixed(1)}" width="${(lmR*2).toFixed(1)}" `+
           `height="${(lmR*2).toFixed(1)}" fill="${paper}" stroke="${grey}" stroke-width="${strokeW}"/>`);
    // label pushed OUTWARD from the centre line so the dense cluster
    // (Shard / Tower Br / St Paul's) spreads apart. Screen-relative, not
    // geographic — the map is rotated, so lm.e no longer means "right".
    const right = x >= homeX;
    P.push(`<text x="${(x+(right?lmR+3:-lmR-3)).toFixed(1)}" y="${(y+fs*0.32).toFixed(1)}" `+
           `text-anchor="${right?"start":"end"}" font-family="Oswald,sans-serif" `+
           `font-size="${(fs*0.56).toFixed(1)}" fill="${grey}">${esc(lm.name)}</text>`);
  }

  // ---- aircraft ----
  const markR=Math.max(3, fs*0.40);
  const arrowLen=fs*1.6;
  const inset=fs*1.2;
  const minX=inset, minY=inset, maxX=W-inset, maxY=H-inset;
  for(const f of flights){
    if(f.dist_km==null||f.bearing_deg==null) continue;
    const inv=f.in_view;
    const [ax,ay]=projBD(f.bearing_deg, f.dist_km);
    const onPanel = ax>=minX && ax<=maxX && ay>=minY && ay<=maxY && f.dist_km<=mapRange;
    // label: the flight number — short enough not to collide now that the
    // map is bigger and carries more traffic. The ETA lives on the board.
    const lab = flightNo(f);

    if(onPanel){
      // heading arrow along track_deg
      const hasTrack = f.track_deg!=null;
      const [dx,dy] = hasTrack ? dirBD(f.track_deg) : [0,-1];
      if(hasTrack){
        P.push(`<line x1="${ax.toFixed(1)}" y1="${ay.toFixed(1)}" x2="${(ax+dx*arrowLen).toFixed(1)}" `+
               `y2="${(ay+dy*arrowLen).toFixed(1)}" stroke="${inv?dark:grey}" `+
               `stroke-width="${(strokeW*1.6).toFixed(2)}" marker-end="url(#${inv?"ah":"ahg"})"/>`);
      }
      // Banking traffic: trace the arc its turn rate implies, so the map shows
      // where the aeroplane is actually going rather than where a straight
      // line says it would go. 90 s of projection, dashed to read as a guess.
      if(f.turn_dps!=null && Math.abs(f.turn_dps)>=0.4 && f.gs_kt && f.track_deg!=null){
        const sp=f.gs_kt*1.852/3600, w=f.turn_dps*D2R, th0=f.track_deg*D2R, rr=sp/w;
        const e0=f.dist_km*Math.sin(f.bearing_deg*D2R);
        const n0=f.dist_km*Math.cos(f.bearing_deg*D2R);
        // stop at 90 s or 90 degrees of turn, whichever comes first — a hard
        // turn would otherwise sweep most of a circle and swamp the map
        const maxT=Math.min(90, 90/Math.abs(f.turn_dps)), pts=[];
        for(let s=0;s<=maxT;s+=maxT/15){
          const th=th0+w*s;
          const [px,py]=proj(e0+rr*(Math.cos(th0)-Math.cos(th)),
                             n0+rr*(Math.sin(th)-Math.sin(th0)));
          pts.push(px.toFixed(1)+","+py.toFixed(1));
        }
        P.push(`<polyline points="${pts.join(" ")}" fill="none" stroke="${inv?dark:grey}" `+
               `stroke-width="${(strokeW*1.3).toFixed(2)}" stroke-linecap="round" `+
               `stroke-dasharray="${(fs*0.22).toFixed(1)} ${(fs*0.34).toFixed(1)}" stroke-opacity=".8"/>`);
      }
      if(inv)
        P.push(`<circle cx="${ax.toFixed(1)}" cy="${ay.toFixed(1)}" r="${markR.toFixed(1)}" fill="${dark}" stroke="${paper}" stroke-width="${strokeW}"/>`);
      else
        P.push(`<circle cx="${ax.toFixed(1)}" cy="${ay.toFixed(1)}" r="${(markR*0.92).toFixed(1)}" fill="${paper}" stroke="${grey}" stroke-width="${(strokeW*1.6).toFixed(2)}"/>`);
      if(emergOf(f))
        P.push(`<circle cx="${ax.toFixed(1)}" cy="${ay.toFixed(1)}" r="${(markR*1.9).toFixed(1)}" fill="none" stroke="${dark}" stroke-width="${(strokeW*2.6).toFixed(2)}"/>`);
      if(lab){
        // Trail the label BEHIND the aircraft, opposite its heading, so it can
        // never sit under the arrow it belongs to. Fixed above-right placement
        // collided head-on with anything tracking up and to the right.
        const off = markR + fs*0.55;
        const bx = ax - dx*off, by = ay - dy*off;
        let anchor, lx = bx, ly;
        if(Math.abs(dx) >= Math.abs(dy)){
          anchor = dx>0 ? "end" : "start";   // behind is left / right
          ly = by + fs*0.32;                 // sit on the marker's centreline
        }else{
          anchor = "middle";                 // behind is above / below
          ly = dy>0 ? by - fs*0.10 : by + fs*0.78;
        }
        // flip rather than run off the panel edge
        const half = fs*0.40*String(lab).length;
        if(anchor==="end"   && lx-half < minX){ anchor="start";  lx = ax+off; }
        if(anchor==="start" && lx+half > maxX){ anchor="end";    lx = ax-off; }
        P.push(`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${anchor}" `+
               `font-family="Oswald,sans-serif" font-weight="${inv?"600":"500"}" `+
               `font-size="${(fs*0.66).toFixed(1)}" fill="${inv?dark:grey}">${esc(lab)}</text>`);
      }
    }else{
      // OUTSIDE the window: clamp to the panel edge along the line from home,
      // draw a small triangle pointing outward + the same label
      const [ex,ey]=rayToRect(homeX,homeY,ax,ay,minX,minY,maxX,maxY);
      const ang=Math.atan2(ay-homeY, ax-homeX);   // outward direction
      const t=fs*0.6;                              // triangle size
      const tip=[ex+Math.cos(ang)*t, ey+Math.sin(ang)*t];
      const bl =[ex+Math.cos(ang+2.5)*t, ey+Math.sin(ang+2.5)*t];
      const br =[ex+Math.cos(ang-2.5)*t, ey+Math.sin(ang-2.5)*t];
      P.push(`<path d="M${tip[0].toFixed(1)},${tip[1].toFixed(1)} L${bl[0].toFixed(1)},${bl[1].toFixed(1)} `+
             `L${br[0].toFixed(1)},${br[1].toFixed(1)} Z" fill="${inv?dark:grey}"/>`);
      if(emergOf(f))
        P.push(`<circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="${(t*1.6).toFixed(1)}" fill="none" stroke="${dark}" stroke-width="${(strokeW*2.6).toFixed(2)}"/>`);
      if(lab){
        // place label on the inboard side of the edge marker
        const anchor = ex>W-W*0.30?"end":(ex<W*0.30?"start":"middle");
        const lx = anchor==="end"?ex-t-2:(anchor==="start"?ex+t+2:ex);
        const ly = ey>H-fs*1.6 ? ey-t-2 : ey+fs*1.0;
        P.push(`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${anchor}" `+
               `font-family="Oswald,sans-serif" font-weight="500" `+
               `font-size="${(fs*0.62).toFixed(1)}" fill="${grey}">${esc(lab)}</text>`);
      }
    }
  }

  // ---- home marker (diamond + dot) near the top ----
  const hs=Math.max(4, fs*0.55);
  P.push(`<path d="M${homeX},${(homeY-hs).toFixed(1)} L${(homeX+hs).toFixed(1)},${homeY} `+
         `L${homeX},${(homeY+hs).toFixed(1)} L${(homeX-hs).toFixed(1)},${homeY} Z" `+
         `fill="${paper}" stroke="${dark}" stroke-width="${(strokeW*1.8).toFixed(2)}"/>`);
  P.push(`<circle cx="${homeX}" cy="${homeY}" r="${(hs*0.34).toFixed(1)}" fill="${dark}"/>`);

  P.push(`</g>`); // end clip

  // ---- compass rose, top-left (outside clip so always visible) ----
  // The map is view-up, so north is NOT up: the needle carries the rotation.
  const nx=fs*2.1, ny=fs*2.1, nr=fs*0.95;
  const [ndx,ndy]=dirBD(0);                       // where north lies on screen
  P.push(`<circle cx="${nx.toFixed(1)}" cy="${ny.toFixed(1)}" r="${nr.toFixed(1)}" `+
         `fill="${paper}" stroke="${grey}" stroke-width="${strokeW}"/>`);
  P.push(`<line x1="${(nx-ndx*nr*0.7).toFixed(1)}" y1="${(ny-ndy*nr*0.7).toFixed(1)}" `+
         `x2="${(nx+ndx*nr*0.7).toFixed(1)}" y2="${(ny+ndy*nr*0.7).toFixed(1)}" `+
         `stroke="${dark}" stroke-width="${(strokeW*1.6).toFixed(2)}"/>`);
  const nhx=nx+ndx*nr, nhy=ny+ndy*nr, na=Math.atan2(ndy,ndx), nt=fs*0.32;
  P.push(`<path d="M${(nhx+Math.cos(na)*nt).toFixed(1)},${(nhy+Math.sin(na)*nt).toFixed(1)} `+
         `L${(nhx+Math.cos(na+2.5)*nt).toFixed(1)},${(nhy+Math.sin(na+2.5)*nt).toFixed(1)} `+
         `L${(nhx+Math.cos(na-2.5)*nt).toFixed(1)},${(nhy+Math.sin(na-2.5)*nt).toFixed(1)} Z" fill="${dark}"/>`);
  // "N" stays upright at the needle's tip, wherever that lands
  P.push(`<text x="${(nx+ndx*nr*2.0).toFixed(1)}" y="${(ny+ndy*nr*2.0+fs*0.30).toFixed(1)}" `+
         `text-anchor="middle" font-family="Oswald,sans-serif" font-weight="600" `+
         `font-size="${(fs*0.82).toFixed(1)}" fill="${dark}">N</text>`);

  // ---- heading label, top-centre: says what "up" means on this map ----
  P.push(`<text x="${(W/2).toFixed(1)}" y="${(fs*1.1).toFixed(1)}" text-anchor="middle" `+
         `font-family="Oswald,sans-serif" font-weight="600" letter-spacing="1.5" `+
         `font-size="${(fs*0.7).toFixed(1)}" fill="${grey}">`+
         `VIEW ${Math.round(bearing)}° ${cardinal(bearing)}</text>`);

  svg.innerHTML=P.join("");
}

/* ---------------- draw ---------------- */

function draw(data){
  const cfg=(data&&data.config)||SAMPLE.config;
  const flights=(data&&data.flights)||[];
  // Diagnostics first: it is what you reach for when something else on this
  // screen has gone wrong, so it must not be skipped by a throw further down.
  renderDebug(cfg);
  // API already sorts in_view first, then eta; keep that order for the list
  const rows=[];
  for(let i=0;i<ROWS;i++) rows.push(rowHtml(flights[i]||null));
  document.getElementById("board").innerHTML=rows.join("");
  document.getElementById("cols").innerHTML=COLS.map(([label,n,dim,right])=>{
    const w=`calc(${n} * (var(--tile-w) + var(--tile-gap)) - var(--tile-gap))`;
    return `<span style="width:${w}${right?";text-align:right":""}">${label}</span>`;
  }).join("");

  // view cone + counts now ride in the header, so the board runs to the edge
  const nView=flights.filter(f=>f.in_view).length;
  const nIn=flights.length-nView;
  document.getElementById("hdr-meta").textContent=
    `${Math.round(cfg.bearing)}° ${cardinal(cfg.bearing)} · ${Math.round(cfg.range_km)} KM`+
    ` · IN VIEW ${nView} · ${nIn} INBOUND`;

  const now=new Date();
  document.getElementById("clock").textContent=
    String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");

  // device battery (captured from the last /api/display poll, ~1 cycle stale)
  const b=cfg.battery||{}, be=document.getElementById("batt");
  if(b.percent!=null){
    const p=Math.max(0,Math.min(100,Math.round(b.percent))), fill=(18*p/100).toFixed(1);
    be.innerHTML=
      `<svg viewBox="0 0 27 12" class="batt-ic">`+
      `<rect x="0.5" y="1" width="22" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1"/>`+
      `<rect x="23" y="4" width="2.4" height="4" rx="0.8" fill="currentColor"/>`+
      `<rect x="2" y="2.5" width="${fill}" height="7" rx="0.7" fill="currentColor"/></svg>`+
      `<span>${p}%</span>`+
      (b.voltage!=null?`<span class="batt-v">${b.voltage.toFixed(2)}V</span>`:"");
  } else { be.innerHTML=""; }

  // emergency banner (rare): list any active emergency squawks up top
  const emerg=flights.filter(emergOf);
  const eb=document.getElementById("emerg-banner");
  if(emerg.length){
    eb.style.display="block";
    eb.textContent="⚠ EMERGENCY "+emerg.map(f=>f.squawk).join(" ");
  }else{ eb.style.display="none"; eb.textContent=""; }

  buildMap(cfg, flights);
}

/* Live when served next to serve.py; sample when opened standalone */
let LAST=SAMPLE;
layout();
addEventListener("resize", ()=>{ layout(); draw(LAST); });
fetch("/api/board",{cache:"no-store"})
  .then(r=>{ if(!r.ok) throw 0; return r.json(); })
  .then(d=>{ LAST=d; draw(d); })
  .catch(()=>{ LAST=SAMPLE; draw(SAMPLE); });
</script>
